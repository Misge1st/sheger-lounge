<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B84A27">
<title>Elo Restaurant — Staff</title>
<style>
  @font-face { font-family: "Constantia"; src: url("fonts/constantia.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Constantia"; src: url("fonts/constantia-bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Palatino"; src: url("fonts/palatino.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Palatino"; src: url("fonts/palatino-bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "BodoniModa"; src: url("fonts/bodoni-italic.ttf") format("truetype"); font-weight: 700; font-style: italic; }
  @font-face { font-family: "Gabriola"; src: url("fonts/gabriola.ttf") format("truetype"); }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-500.ttf") format("truetype"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-500i.ttf") format("truetype"); font-weight: 500; font-style: italic; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-600.ttf") format("truetype"); font-weight: 600; font-style: normal; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-700.ttf") format("truetype"); font-weight: 700; font-style: normal; }

  :root {
    --ink: #2C1E18;
    --ivory: #FAF6F0;
    --gold: #8A5A12;
    --gold-bright: #8A5A12;
    --gold-deep: #8A5A12;
    --gold-line: rgba(44, 30, 24, 0.16);
    --gold-line-strong: rgba(44, 30, 24, 0.28);
    --cream: #2C1E18;
    --red: #B84A27;
    --red-deep: #963c1f;
    --mute: #5c463c;
    --text: #2C1E18;
    --radius: 12px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, "Segoe UI", sans-serif;
    font-weight: 500;
    background: #F3EBE1;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body:before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px;
    mix-blend-mode: soft-light;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--cream); }
  ::selection { background: rgba(200, 16, 46, 0.35); color: var(--cream); }

  #login, #app {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 16px 130px;
    animation: rise 0.7s var(--ease) both;
  }
  #login[hidden], #app[hidden], .publish[hidden] { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand .brand-logo {
    width: min(200px, 58vw);
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
  }
  .brand .bar {
    width: min(180px, 55%);
    height: 6px;
    margin: 14px auto 0;
    position: relative;
  }
  .brand .bar i {
    position: absolute; left: 0; top: 0;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red);
    box-shadow: 12px 0 0 var(--red), 24px 0 0 var(--red);
  }
  .brand .bar span {
    position: absolute; left: 36px; right: 0; top: 2px;
    height: 2px;
    background: linear-gradient(90deg, var(--red), var(--gold));
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
  }
  .lede {
    color: var(--mute);
    margin: 0 0 22px;
    line-height: 1.45;
    font-size: 18px;
    font-style: normal;
  }
  .help {
    margin: 0 0 18px;
    padding: 14px 16px;
    background: #fff;
    border: 1px solid var(--gold-line);
    border-left: 6px solid var(--red);
    border-radius: 10px;
    font-size: 18px;
    line-height: 1.45;
  }

  form.card, .card {
    border: 1px solid var(--gold-line);
    border-radius: var(--radius);
    padding: 20px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(44, 30, 24, 0.06);
  }
  label.field { display: block; margin: 14px 0; }
  label.field span, .check span {
    display: block;
    margin-bottom: 7px;
    color: var(--gold);
    letter-spacing: 0.06em;
    font-size: 14px;
    font-weight: 600;
  }
  input, textarea, select {
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--gold-line-strong);
    border-radius: var(--radius);
    background: #fff;
    padding: 10px 14px;
    font-size: 17px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
  }
  textarea { min-height: 88px; }
  .check { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--gold); }
  .error { color: #ffb4a8; min-height: 1.3em; font-size: 15px; }

  button, .linkish {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: var(--red);
    color: #fff;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.2;
    white-space: nowrap;
    padding: 0 16px;
    cursor: pointer;
    box-shadow: none;
  }
  button:hover, .linkish:hover { background: var(--red-deep); }
  button:active, .linkish:active { background: var(--red-deep); }
  button.ghost, a.ghost {
    background: #2C1E18;
    color: #fff;
    border: 0;
    text-decoration: none;
    box-shadow: none;
  }
  button.ghost:hover, a.ghost:hover { background: #1a1210; color: #fff; }
  button.warn {
    background: #c0102e;
    color: #fff;
    border: 0;
    box-shadow: none;
  }
  button.warn:hover { background: #9d0d26; color: #fff; }

  .top, .tabs, .row-actions, .publish {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .lines { display: grid; gap: 10px; margin: 6px 0 0; }
  .line {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
  }
  .line input { width: 100%; min-width: 0; }
  .line button { min-height: 46px; }
  .editor-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
  }
  .editor-actions-main {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-left: auto;
  }
  .top { justify-content: space-between; margin-bottom: 18px; align-items: flex-start; }
  .tabs {
    margin: 8px 0 14px;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .tabs button {
    background: #fff;
    color: var(--ink);
    border: 2px solid rgba(44, 30, 24, 0.2);
    border-radius: 12px;
    min-height: 56px;
    font-size: 17px;
    font-weight: 800;
    box-shadow: 0 3px 0 rgba(44, 30, 24, 0.18);
  }
  .tabs button[aria-selected="true"] {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }
  h2 {
    font-size: 20px;
    letter-spacing: 0;
    text-transform: none;
    margin: 26px 0 10px;
    color: var(--ink);
    font-weight: 800;
  }
  .row, form.editor {
    border: 1px solid var(--gold-line);
    border-radius: 12px;
    background: #fff;
    padding: 16px;
    margin: 10px 0;
  }
  .row strong { display: block; font-size: 22px; color: var(--ink); }
  .row p, .muted { color: var(--mute); margin: 4px 0 8px; line-height: 1.45; }
  .off { color: #ffb4a8; font-size: 14px; }
  @media (max-width: 720px) {
    .line { grid-template-columns: 1fr 1fr; }
    .line button { grid-column: 1 / -1; justify-self: start; }
    .editor-actions-main { margin-left: 0; }
  }
  .preview {
    width: 112px;
    height: 88px;
    object-fit: cover;
    border-radius: 2px;
    background: rgba(198, 161, 90, 0.12);
    display: block;
    margin-bottom: 10px;
    border: 1px solid rgba(212, 175, 55, 0.35);
  }
  .photo-bank { margin-bottom: 12px; }
  .photo-slots {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
  }
  .photo-slot {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .photo-slot .preview { margin-bottom: 0; }
  .photo-slot button { width: 100%; }
  .preview.home-preview,
  .home-preview {
    width: 140px;
    height: 100px;
  }
  .publish {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 3px solid var(--red);
    justify-content: space-between;
    box-shadow: 0 -8px 24px rgba(44, 30, 24, 0.12);
  }
  .publish p { margin: 0; flex: 1; color: var(--ink); font-size: 17px; font-weight: 650; }
  #publish { min-height: 56px; font-size: 18px; padding: 10px 18px; }
  button:disabled { opacity: 0.55; transform: none; }

  .login-alert {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 20px;
    padding: 16px 18px;
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    background: #fff4ec;
    color: var(--text);
    box-shadow: 0 12px 32px rgba(200, 16, 46, 0.15);
  }
  .login-alert[hidden] { display: none; }
  .login-alert b {
    min-width: 46px;
    height: 46px;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    border: 1px solid var(--gold);
  }
  .order-card {
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: var(--radius);
    padding: 16px;
    margin: 14px 0;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .order-card.new {
    border-color: var(--gold);
    box-shadow: inset 0 0 0 1px rgba(242, 193, 75, 0.2), 0 10px 28px rgba(0, 0, 0, 0.28);
  }
  .order-card h3 { margin: 0 0 8px; font-size: 22px; color: var(--ink); letter-spacing: 0; }
  .order-card .meta { color: var(--ink); margin: 0 0 12px; line-height: 1.35; display: grid; gap: 10px; }
  .order-card .field-line b {
    display: block;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--mute);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .order-card .field-line span,
  .order-card .field-line a { font-size: 18px; color: var(--ink); }
  .order-card ul { margin: 0 0 14px; padding-left: 18px; }
  .order-card .money { display: grid; gap: 4px; margin-bottom: 14px; color: var(--gold-bright); }
  .badge-tab { display: inline-flex; align-items: center; gap: 8px; }
  .badge-tab i {
    min-width: 22px;
    height: 22px;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-style: normal;
    font-size: 12px;
    border: 1px solid var(--gold);
  }
  .badge-tab i[hidden] { display: none; }

  #login-form button[type="submit"] {
    width: 100%;
    margin-top: 8px;
    min-height: 50px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 0;
    background: var(--red);
    color: #fff;
  }

  .welcome {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #F3EBE1;
  }
  .welcome[hidden] { display: none; }
  .welcome.show { animation: welcome-screen 2s linear forwards; }
  .welcome-card {
    text-align: center;
  }
  .welcome.show .welcome-card {
    animation: welcome-card 0.55s var(--ease) both;
  }
  .welcome-card img {
    width: 112px;
    height: auto;
    display: block;
    margin: 0 auto 14px;
  }
  .welcome-card h2 {
    margin: 0;
    font-family: "Cormorant", Palatino, Georgia, serif;
    font-weight: 600;
    font-size: clamp(40px, 7vw, 64px);
    letter-spacing: 0;
    color: var(--ink);
  }
  .welcome-card p {
    margin: 8px 0 0;
    font-size: 22px;
    letter-spacing: 0;
    color: var(--mute);
    font-weight: 600;
  }
  @keyframes welcome-screen {
    0% { opacity: 0; }
    10% { opacity: 1; }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes welcome-card {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

</head>
<body>
<div class="welcome" id="welcome" hidden role="status" aria-live="polite">
  <div class="welcome-card">
    <img src="elo-logo-clean.png" alt="">
    <h2>Hello Medhanit</h2>
    <p>Welcome back</p>
  </div>
</div>
<section id="login">
  <div class="brand" aria-hidden="true">
    <img class="brand-logo" src="elo-logo-clean.png" alt="Elo Restaurant">
    <div class="bar"><i></i><span></span></div>
  </div>
  <h1>Staff page</h1>
  <p class="lede">Type the password, then press Open. This is only for Elo staff.</p>
  <div class="login-alert" id="login-alert" hidden>
    <b id="login-count">0</b>
    <div>
      <strong id="login-alert-title">Active orders</strong>
      <div class="muted" id="login-alert-text">Sign in to see them.</div>
    </div>
  </div>
  <form class="card" id="login-form">
    <label class="field">
      <span>Staff password</span>
      <input id="password" type="password" autocomplete="current-password" required placeholder="Type the password">
    </label>
    <p class="error" id="login-error"></p>
    <button type="submit">Open</button>
  </form>
</section>

<section id="app" hidden>
  <div class="brand" aria-hidden="true">
    <img class="brand-logo" src="elo-logo-clean.png" alt="Elo Restaurant">
    <div class="bar"><i></i><span></span></div>
  </div>
  <div class="top">
    <h1>What do you want to do?</h1>
    <div class="row-actions">
      <a class="ghost" href="index.html">See the website</a>
      <button class="ghost" type="button" id="logout">Leave</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" data-tab="orders" aria-selected="false" class="badge-tab">Orders <i id="orders-badge" hidden>0</i></button>
    <button type="button" data-tab="food" aria-selected="true">Food prices</button>
    <button type="button" data-tab="drinks" aria-selected="false">Drink prices</button>
    <button type="button" data-tab="home" aria-selected="false">Photos</button>
    <button type="button" data-tab="lounge" aria-selected="false">Phone and address</button>
  </div>
  <p class="help" id="help"></p>
  <div id="panel"></div>
</section>

<div class="publish" id="publish-bar" hidden>
  <p id="status">Customers still see the old menu until you press the button.</p>
  <button type="button" id="publish">Show changes to customers</button>
</div>

<script src="js/menu.js?v=20261125d"></script>
<script src="js/admin.js?v=20261125d"></script>
</body>
</html>
